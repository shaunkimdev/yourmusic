function clean(value) {
  return String(value || '').trim();
}

function backendConfigured() {
  return Boolean(
    clean(window.YOURMUSIC_CONFIG.supabaseUrl) &&
    clean(window.YOURMUSIC_CONFIG.supabaseAnonKey)
  );
}

async function callYourMusicFunction(name, payload) {
  if (!backendConfigured()) {
    throw new Error('Supabase is not configured.');
  }

  const baseUrl = clean(window.YOURMUSIC_CONFIG.supabaseUrl).replace(/\/$/, '');
  const anonKey = clean(window.YOURMUSIC_CONFIG.supabaseAnonKey);
  const response = await fetch(`${baseUrl}/functions/v1/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: anonKey,
      Authorization: `Bearer ${anonKey}`,
    },
    body: JSON.stringify(payload),
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.error || `${name} failed`);
  }
  return data;
}

async function callSupabaseRpc(name, payload) {
  if (!backendConfigured()) {
    throw new Error('Supabase is not configured.');
  }

  const baseUrl = clean(window.YOURMUSIC_CONFIG.supabaseUrl).replace(/\/$/, '');
  const anonKey = clean(window.YOURMUSIC_CONFIG.supabaseAnonKey);
  const response = await fetch(`${baseUrl}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: anonKey,
      Authorization: `Bearer ${anonKey}`,
    },
    body: JSON.stringify(payload),
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.message || data.error || `${name} failed`);
  }
  return data;
}

function getAppShareUrl() {
  const origin = window.location.origin;

}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  const copied = document.execCommand('copy');
  document.body.removeChild(textarea);
  return copied ? Promise.resolve() : Promise.reject(new Error('copy_failed'));
}

const previewLookupCache = {};

async function lookupPreviewUrl(artist, title) {
  const term = [clean(artist), clean(title)].filter(Boolean).join(' ');
  if (!term) return '';

  const cacheKey = term.toLowerCase();
  if (Object.prototype.hasOwnProperty.call(previewLookupCache, cacheKey)) {
    return previewLookupCache[cacheKey];
  }

  const url = new URL('https://itunes.apple.com/search');
  url.searchParams.set('term', term);
  url.searchParams.set('entity', 'song');
  url.searchParams.set('limit', '1');

  try {
    const response = await fetch(url.toString());
    if (!response.ok) throw new Error('preview lookup failed');
    const data = await response.json();
    const item = (data.results || []).find((result) => clean(result.previewUrl)) || data.results?.[0];
    previewLookupCache[cacheKey] = clean(item && item.previewUrl);
  } catch (error) {
    previewLookupCache[cacheKey] = '';
  }

  return previewLookupCache[cacheKey];
}

const LOCAL_MOOD_KEYWORDS = {
  nostalgic: ['그리', '추억', '옛', '레트로', '네온', 'nostalgic'],
  uplifting: ['상쾌', '기분전환', '드라이브', '달리', '바람', 'uplifting'],
  melancholy: ['쓸쓸', '외로', '우울', '슬프', '겨울', '혼자', 'melancholy'],
  summer: ['여름', '바다', '해변', '휴가', '햇살', 'summer'],
  romantic: ['사랑', '연애', '설렘', '봄', '벚꽃', 'romantic'],
  'late-night': ['밤', '새벽', '야경', '자정', 'late night'],
  warm: ['따뜻', '포근', '비', '카페', '커피', '위로', 'warm'],
  energetic: ['신나', '활기', '에너지', '운동', '출근', 'energetic'],
};

function classifyLocalMood(text) {
  const source = clean(text).toLowerCase();
  let best = { key: 'warm', score: 0 };
  Object.entries(LOCAL_MOOD_KEYWORDS).forEach(([key, keywords]) => {
    const score = keywords.reduce((sum, keyword) => (
      source.includes(keyword.toLowerCase()) ? sum + 1 : sum
    ), 0);
    if (score > best.score) best = { key, score };
  });
  return best.key;
}

function localRecommendations(moodText, limit = 6) {
  const mood = classifyLocalMood(moodText);
  const primary = window.MUSIC_DATA.filter(song => song.mood === mood);
  return [...primary].sort(() => Math.random() - 0.5).slice(0, limit);
}

function isValidContact(type, value) {
  const v = clean(value);
  if (!v) return false;
  if (type === 'email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if (type === 'instagram') return /^@?[a-zA-Z0-9._]{2,30}$/.test(v);
  if (type === 'phone') return /^01[016789]-?\d{3,4}-?\d{4}$/.test(v);
  return v.length >= 2;
}

function validateSubmission({ artist, title, matched, confirmed, scene, contactType, contact, privacyAgreed }) {
  const nextErrors = {};

  if (!clean(artist) && !clean(title)) {
    nextErrors.song = '가수 또는 노래 제목 중 하나는 입력해주세요.';
  }

  if (matched && !confirmed) {
    nextErrors.confirmed = '검색된 노래가 맞는지 YES를 눌러 확인해주세요.';
  }

  if (!clean(scene)) {
    nextErrors.scene = '노래와 연결된 장면이나 경험담을 적어주세요.';
  }

  if (clean(contact) && !isValidContact(contactType, contact)) {
    nextErrors.contact = `${CONTACT_LABELS[contactType]} 형식을 확인해주세요.`;
  }

  if (clean(contact) && !privacyAgreed) {
    nextErrors.privacy = '경품 연락을 위한 개인정보 수집에 동의해주세요.';
  }

  return nextErrors;
}

function musicSearchQuery(song) {
  return [song && song.title, song && song.artist].map(clean).filter(Boolean).join(' ');
}

function musicServiceLinks(song) {
  const query = musicSearchQuery(song);
  if (!query) return { youtubeMusic: '', melon: '', spotify: '' };
  const encoded = encodeURIComponent(query);
  const spotifyTrackId = song && clean(song.spotifyTrackId);
  return {
    youtubeMusic: `https://music.youtube.com/search?q=${encoded}`,
    melon: `https://www.melon.com/search/total/index.htm?q=${encoded}`,
    spotify: spotifyTrackId
      ? `https://open.spotify.com/track/${encodeURIComponent(spotifyTrackId)}`
      : `https://open.spotify.com/search/${encoded}`,
  };
}

function SpotifyMiniEmbed({ song }) {
  const previewAudioRef = React.useRef(null);
  const [audioEnabled, setAudioEnabled] = React.useState(false);
  const [reloadToken, setReloadToken] = React.useState(0);
  const [fallbackPreviewUrl, setFallbackPreviewUrl] = React.useState('');
  const spotifyTrackId = song && clean(song.spotifyTrackId);
  const spotifyPreviewUrl = (song && clean(song.spotifyPreviewUrl)) || fallbackPreviewUrl;
  const links = musicServiceLinks(song);
  const embedUrl = spotifyTrackId
    ? `https://open.spotify.com/embed/track/${encodeURIComponent(spotifyTrackId)}?utm_source=generator${audioEnabled ? '&autoplay=1' : ''}`
    : '';

  function enableAudio() {
    if (!spotifyPreviewUrl && !spotifyTrackId) return;
    setAudioEnabled(true);
    setReloadToken((value) => value + 1);
    if (previewAudioRef.current) {
      previewAudioRef.current.play().catch(() => undefined);
    }
    window.dispatchEvent(new CustomEvent('yourmusic-spotify-status', { detail: { audioEnabled: true } }));
  }

  function disableAudio() {
    setAudioEnabled(false);
    setReloadToken((value) => value + 1);
    if (previewAudioRef.current) {
      previewAudioRef.current.pause();
      previewAudioRef.current.currentTime = 0;
    }
    window.dispatchEvent(new CustomEvent('yourmusic-spotify-status', { detail: { audioEnabled: false } }));
  }

  React.useEffect(() => {
    window.dispatchEvent(new CustomEvent('yourmusic-spotify-status', {
      detail: { isReady: Boolean(spotifyPreviewUrl || spotifyTrackId), audioEnabled },
    }));
  }, [spotifyPreviewUrl, spotifyTrackId, audioEnabled]);

  React.useEffect(() => {
    let cancelled = false;
    const providedPreviewUrl = song && clean(song.spotifyPreviewUrl);

    setFallbackPreviewUrl('');
    if (!song || providedPreviewUrl) return undefined;

    lookupPreviewUrl(song.artist, song.title).then((url) => {
      if (!cancelled) setFallbackPreviewUrl(url);
    });

    return () => {
      cancelled = true;
    };
  }, [song && song.artist, song && song.title, song && song.spotifyPreviewUrl]);

  React.useEffect(() => {
    const audio = previewAudioRef.current;
    if (!audio) return;

    audio.pause();
    audio.currentTime = 0;

    if (audioEnabled && spotifyPreviewUrl) {
      audio.play().catch(() => undefined);
    }
  }, [spotifyPreviewUrl, audioEnabled]);

  React.useEffect(() => {
    if (spotifyPreviewUrl) return;
    setReloadToken((value) => value + 1);
  }, [spotifyPreviewUrl, spotifyTrackId, audioEnabled]);

  React.useEffect(() => {
    window.addEventListener('yourmusic-enable-spotify-auto', enableAudio);
    window.addEventListener('yourmusic-disable-spotify-auto', disableAudio);
    return () => {
      window.removeEventListener('yourmusic-enable-spotify-auto', enableAudio);
      window.removeEventListener('yourmusic-disable-spotify-auto', disableAudio);
    };
  });

  return (
    <div style={{
      marginTop: 8,
      marginBottom: 8,
      border: `3px solid ${T2.ink}`,
      boxShadow: `2px 2px 0 ${T2.ink}`,
      background: T2.ink,
      height: 80,
      overflow: 'hidden',
      position: 'relative',
    }}>
      {spotifyPreviewUrl ? (
        <div style={{
          height: '100%',
          padding: '8px 10px',
          background: '#191414',
          color: '#fff',
          display: 'flex',
          alignItems: 'center',
          gap: 10,
        }}>
          <div style={{
            width: 36,
            height: 36,
            flexShrink: 0,
            border: '2px solid #1DB954',
            background: '#1DB954',
            color: '#111',
            fontFamily: T2.fontEn,
            fontSize: 13,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
          }}>
            ▶
          </div>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: 8,
              marginBottom: 4,
            }}>
              <div style={{ fontFamily: T2.fontEn, fontSize: 8, color: '#1DB954', letterSpacing: '0.04em' }}>
                30 SEC PREVIEW
              </div>
              <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                <a
                  href={links.youtubeMusic}
                  target="_blank"
                  rel="noopener noreferrer"
                  title="YouTube Music에서 찾기"
                  aria-label="YouTube Music에서 찾기"
                  style={{
                    width: 22,
                    height: 18,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    border: '2px solid #fff',
                    background: '#FF0033',
                    color: '#fff',
                    fontFamily: T2.fontEn,
                    fontSize: 8,
                    lineHeight: 1,
                    textDecoration: 'none',
                    boxShadow: '1px 1px 0 #000',
                  }}
                >
                  ▶
                </a>
                <a
                  href={links.melon}
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Melon에서 찾기"
                  aria-label="Melon에서 찾기"
                  style={{
                    width: 22,
                    height: 18,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    border: '2px solid #fff',
                    background: '#00CD3C',
                    color: '#111',
                    fontFamily: T2.fontEn,
                    fontSize: 9,
                    fontWeight: 'bold',
                    lineHeight: 1,
                    textDecoration: 'none',
                    boxShadow: '1px 1px 0 #000',
                  }}
                >
                  M
                </a>
              </div>
            </div>
            <div style={{ fontSize: 10.5, lineHeight: 1.2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginBottom: 4 }}>
              {song ? `${song.title} · ${song.artist}` : 'NO TRACK'}
            </div>
            <audio
              ref={previewAudioRef}
              src={spotifyPreviewUrl}
              controls
              preload="none"
              style={{ width: '100%', height: 28, display: 'block' }}
            />
          </div>
        </div>
      ) : embedUrl ? (
        <iframe
          key={`${spotifyTrackId}-${reloadToken}`}
          title={`${song.title} - ${song.artist} Spotify player`}
          src={embedUrl}
          width="100%"
          height="80"
          frameBorder="0"
          allowFullScreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
          style={{ display: 'block', border: 0 }}
        />
      ) : (
        <div style={{
          height: '100%',
          padding: '10px 12px',
          background: '#191414',
          color: '#fff',
          display: 'flex',
          alignItems: 'center',
          gap: 10,
        }}>

              TRACK UNAVAILABLE

}

function PixelShareIcon({ type, size = 3 }) {
  const patterns = {
    kakao: [
      '001111100',
      '011111110',
      '111111111',
      '110101011',
      '111111111',
      '011111110',
      '001111000',
      '000010000',
    ],
    copy: [
      '001111110',
      '001000010',
      '111111010',
      '100001010',
      '101111110',
      '101000000',
      '101111100',
      '100000100',
      '111111100',
    ],
  };
  const pixels = patterns[type] || patterns.copy;
  const color = type === 'kakao' ? '#3A2A00' : T2.ink;

  return (
    <span
      aria-hidden="true"
      style={{
        display: 'inline-grid',
        gridTemplateColumns: `repeat(${pixels[0].length}, ${size}px)`,
        gridTemplateRows: `repeat(${pixels.length}, ${size}px)`,
        gap: 0,
        flexShrink: 0,
      }}
    >
      {pixels.flatMap((row, y) => row.split('').map((cell, x) => (
        <span
          key={`${type}-${y}-${x}`}
          style={{
            width: size,
            height: size,
            background: cell === '1' ? color : 'transparent',
          }}
        />
      )))}
    </span>
  );
}

function PixelHeartIcon({ size = 4 }) {
  const pixels = [
    '0110110',
    '1111111',
    '1111111',
    '1111111',
    '0111110',
    '0011100',
    '0001000',
  ];

  return (
    <span
      aria-hidden="true"
      style={{
        display: 'inline-grid',
        gridTemplateColumns: `repeat(7, ${size}px)`,
        gridTemplateRows: `repeat(7, ${size}px)`,
        gap: 0,
        filter: `drop-shadow(1px 1px 0 ${T2.ink})`,
        verticalAlign: 'middle',
      }}
    >
      {pixels.flatMap((row, y) => row.split('').map((cell, x) => (
        <span
          key={`${y}-${x}`}
          style={{
            width: size,
            height: size,
            background: cell === '1' ? T2.magenta : 'transparent',
          }}
        />
      )))}
    </span>
  );
}

function BeltScreen({ navigate, initialData, heartCounts, setHeartCounts, heartClicked, setHeartClicked }) {
  const plates = (initialData && Array.isArray(initialData.songs) && initialData.songs.length)
    ? initialData.songs
    : window.SUSHI_PLATES;
  const beltDuration = 60;
  const featuredDuration = `${beltDuration / Math.max(plates.length, 1)}s`;
  const mood = clean(initialData && initialData.mood);
  const moodKey = clean(initialData && initialData.moodKey);
  const [activeSong, setActiveSong] = useState(plates[0] || null);
  const [spotifyReady, setSpotifyReady] = useState(false);
  const [spotifyAudioEnabled, setSpotifyAudioEnabled] = useState(false);
  const [heartPending, setHeartPending] = useState({});
  const [heartError, setHeartError] = useState('');
  const r = activeSong && activeSong.recommender;
  const hasSpotifyTrack = Boolean(activeSong && (clean(activeSong.spotifyPreviewUrl) || clean(activeSong.spotifyTrackId)));

  useEffect(() => {
    setActiveSong(plates[0] || null);
    const nextCounts = {};
    plates.forEach(song => {
      nextCounts[song.id] = Number(song.heartCount || 0);
    });
    setHeartCounts(prev => {
      const mergedCounts = { ...prev };
      Object.keys(nextCounts).forEach(id => {
        if (mergedCounts[id] === undefined) {
          mergedCounts[id] = nextCounts[id];
        }
      });
      return mergedCounts;
    });
  }, [plates]);

  useEffect(() => {
    const updateSpotifyStatus = (event) => {
      if (event.detail && typeof event.detail.isReady === 'boolean') {
        setSpotifyReady(event.detail.isReady);
      }
      if (event.detail && typeof event.detail.audioEnabled === 'boolean') {
        setSpotifyAudioEnabled(event.detail.audioEnabled);
      }
    };

    window.addEventListener('yourmusic-spotify-status', updateSpotifyStatus);
    return () => window.removeEventListener('yourmusic-spotify-status', updateSpotifyStatus);
  }, []);

  function toggleSpotifyAuto() {
    window.dispatchEvent(new CustomEvent(
      spotifyAudioEnabled ? 'yourmusic-disable-spotify-auto' : 'yourmusic-enable-spotify-auto'
    ));
  }

  function getHeartCount(song) {
    if (!song) return 0;
    return Number(heartCounts[song.id] ?? song.heartCount ?? 0);
  }

  async function heartSong(song) {
    if (!song || heartClicked || heartPending[song.id]) return;
    const currentCount = getHeartCount(song);
    const optimisticCount = currentCount + 1;
    setHeartError('');
    setHeartClicked(true);
    setHeartPending(prev => ({ ...prev, [song.id]: true }));
    setHeartCounts(prev => ({ ...prev, [song.id]: optimisticCount }));

    if (!backendConfigured()) {
      setHeartPending(prev => ({ ...prev, [song.id]: false }));
      return;
    }

    try {
      let result;
      try {
        result = await callYourMusicFunction('heart-song', { songId: song.id });
      } catch (functionError) {
        const rpcResult = await callSupabaseRpc('increment_song_heart', { target_song_id: song.id });
        const row = Array.isArray(rpcResult) ? rpcResult[0] : rpcResult;
        result = { heartCount: row && row.heart_count };
      }
      const savedCount = Number(result.heartCount || optimisticCount);
      setHeartCounts(prev => ({ ...prev, [song.id]: savedCount }));
    } catch (error) {
      setHeartCounts(prev => ({ ...prev, [song.id]: currentCount }));
      setHeartError('하트 저장에 실패했습니다.');
    } finally {
      setHeartPending(prev => ({ ...prev, [song.id]: false }));
    }
  }

  function openSongDetail(song) {
    const currentSong = {
      ...song,
      heartCount: getHeartCount(song),
    };
    navigate('banner', {
      song: currentSong,
      returnTo: 'belt',
      beltData: initialData || {
        mood,
        moodKey,
        songs: plates.map(plate => ({
          ...plate,
          heartCount: getHeartCount(plate),
        })),
      },
    });
  }

  return (
    <div className="screen">
      <Bg>
        <SBar />
        <TNav title="노래 고르기" subtitle="접시 위 앨범커버를 골라보세요" onBack={() => navigate('home')} />

        <div style={{ padding: '0 14px 14px' }}>
          <Dialog blinkArrow color={T2.cream}>
            {mood ? (
              <>지금 기분: <strong>{mood}</strong><br/>{moodKey ? `분류된 mood: ${moodKey}` : '레일 위 접시에서 끌리는 앨범을 골라보세요.'}</>
            ) : (
              <>레일 위 접시에서 끌리는 앨범을 골라보세요.</>
            )}
          </Dialog>
          <div style={{ marginTop: 10, display: 'flex', justifyContent: 'flex-end' }}>
            <Btn
              color={spotifyAudioEnabled ? T2.cyan : T2.magenta}
              size="sm"
              onClick={toggleSpotifyAuto}
              style={{
                fontFamily: T2.fontKr,
                fontSize: 14,
                minWidth: 178,
                opacity: spotifyReady && hasSpotifyTrack ? 1 : 0.55,
                pointerEvents: spotifyReady && hasSpotifyTrack ? 'auto' : 'none',
              }}
            >
              🔊 {spotifyAudioEnabled
                ? '사운드 자동 끄기'
                : !hasSpotifyTrack
                  ? 'NO TRACK'
                  : spotifyReady
                    ? '사운드 자동 켜기'
                    : 'LOADING'}
            </Btn>
          </div>
        </div>

        <div style={{
          minHeight: 360,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          padding: '18px 0 8px',
        }}>
          <div style={{ position: 'relative' }}>
            <Belt
              plates={plates}
              radius={118}
              plateSize={66}
              onActiveSongChange={setActiveSong}
              onPlateClick={openSongDetail}
            />
            {activeSong && (
              <>
                <div
                  key={`${activeSong.id}-heart-guide`}
                  style={{
                    position: 'absolute',
                    left: '50%',
                    top: '74%',
                    width: 286,
                    padding: '7px 9px',
                    transform: 'translate(-50%, -50%)',
                    background: T2.cream,
                    border: `3px solid ${T2.ink}`,
                    boxShadow: `3px 3px 0 ${T2.ink}`,
                    color: T2.ink,
                    fontFamily: T2.fontKr,
                    fontSize: 12,
                    fontWeight: 900,
                    lineHeight: 1.35,
                    textAlign: 'center',
                    pointerEvents: 'none',
                    zIndex: 85,
                    animation: `featuredCoverFade ${featuredDuration} ease-in-out forwards`,
                  }}
                >
                  이 곡이 마음에 든다면<br/>
                  아래 하트 <PixelHeartIcon size={2} />를 눌러주세요
                </div>
                <div
                  key={activeSong.id}
                  onClick={() => openSongDetail(activeSong)}
                  style={{
                    position: 'absolute',
                    left: '50%',
                    top: '47%',
                    width: 144,
                    height: 144,
                    transform: 'translate(-50%, -50%)',
                    background: activeSong.coverColor,
                    border: `4px solid ${T2.ink}`,
                    boxShadow: `5px 5px 0 ${T2.ink}`,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    overflow: 'hidden',
                    cursor: 'pointer',
                    zIndex: 80,
                    animation: `featuredCoverFade ${featuredDuration} ease-in-out forwards`,
                  }}
                >
                  {activeSong.coverImage ? (
                    <img
                      src={activeSong.coverImage}
                      alt={`${activeSong.artist} - ${activeSong.title}`}
                      style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                    />
                  ) : (
                    <div style={{ fontSize: 40 }}>{activeSong.cover}</div>
                  )}
                </div>
              </>
            )}
          </div>
        </div>

        {activeSong && (
          <div style={{ padding: '0 14px 12px' }}>
            <Dialog color={T2.paper}>
              <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 10 }}>
                <div style={{
                  width: 54,
                  height: 54,
                  background: activeSong.coverColor,
                  border: `3px solid ${T2.ink}`,
                  boxShadow: `2px 2px 0 ${T2.ink}`,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  overflow: 'hidden',
                  flexShrink: 0,
                }}>
                  {activeSong.coverImage ? (
                    <img
                      src={activeSong.coverImage}
                      alt={`${activeSong.artist} - ${activeSong.title}`}
                      style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                    />
                  ) : (
                    activeSong.cover
                  )}
                </div>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.magenta, marginBottom: 4, letterSpacing: '0.04em' }}>
                    THIS SONG
                  </div>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                    <div style={{ fontFamily: T2.fontEn, fontSize: 10.5, color: T2.ink, lineHeight: 1.3, minWidth: 0, flex: 1 }}>
                      {activeSong.title}
                    </div>
                    <button
                      type="button"
                      onClick={() => heartSong(activeSong)}
                      disabled={heartClicked || Boolean(heartPending[activeSong.id])}
                      aria-label={heartClicked ? '하트 누름 완료' : '하트 누르기'}
                      style={{
                        flexShrink: 0,
                        display: 'flex',
                        alignItems: 'center',
                        gap: 6,
                        minWidth: 74,
                        height: 34,
                        padding: '4px 7px',
                        background: T2.cream,
                        border: `3px solid ${T2.ink}`,
                        boxShadow: `2px 2px 0 ${T2.ink}`,
                        cursor: heartClicked || heartPending[activeSong.id] ? 'default' : 'pointer',
                        opacity: heartClicked || heartPending[activeSong.id] ? 0.78 : 1,
                      }}
                    >
                      <PixelHeartIcon size={3} />
                      <span style={{
                        fontFamily: T2.fontEn,
                        fontSize: 15,
                        lineHeight: 1,
                        color: T2.magenta,
                        textShadow: `1px 1px 0 ${T2.ink}`,
                      }}>
                        {getHeartCount(activeSong)}
                      </span>
                    </button>
                  </div>
                  <div style={{ fontSize: 11, color: T2.inkSoft, marginTop: 3 }}>
                    ♪ {activeSong.artist}
                  </div>
                </div>
              </div>
              <ErrorText>{heartError}</ErrorText>
              <div style={{ fontSize: 11.5, lineHeight: 1.55, marginBottom: activeSong.lyric ? 8 : 0 }}>
                "{activeSong.scene}"
              </div>
              {activeSong.lyric && activeSong.lyric !== '(instrumental)' && (
                <div style={{ fontSize: 11, color: T2.lavender, lineHeight: 1.5, marginBottom: 8 }}>
                  ♪ {activeSong.lyric}
                </div>
              )}
              {r && (r.name || r.age || r.city) && (
                <div style={{ fontSize: 10.5, color: T2.inkSoft, marginBottom: activeSong.spotifyTrackId ? 8 : 0 }}>
                  BY {r.name || '?'} {r.age ? `· ${r.age}세` : ''} {r.city ? `· ${r.city}` : ''}
                </div>
              )}
              <SpotifyMiniEmbed song={activeSong} />
            </Dialog>
          </div>
        )}

        <div style={{
          textAlign: 'center',
          fontFamily: T2.fontEn,
          fontSize: 8,
          color: '#fff',
          textShadow: `1px 1px 0 ${T2.ink}`,
          marginBottom: 18,
          letterSpacing: '0.1em',
        }}>
          ▼ TAP AN ALBUM PLATE ▼
        </div>

        <div style={{ height: 16 }} />
      </Bg>

// 화면 3: 노래 추천 폼
// ══════════════════════════════════════════════════════════════
function FormScreen({ navigate, initialData }) {
  const [artist, setArtist] = useState('');
  const [title, setTitle] = useState('');
  const [matched, setMatched] = useState(null);
  const [confirmed, setConfirmed] = useState(false);
  const [scene, setScene] = useState('');
  const [lyric, setLyric] = useState('');
  const [name, setName] = useState('');
  const [age, setAge] = useState('');
  const [city, setCity] = useState('');
  const [contactType, setContactType] = useState('email');
  const [contact, setContact] = useState('');
  const [privacyAgreed, setPrivacyAgreed] = useState(false);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);

  function clearErrors(...keys) {
    setErrors(current => {
      const next = { ...current };
      keys.forEach(key => delete next[key]);
      return next;
    });
  }

  // 가수/제목 입력 시 mock 데이터에서 찾기
  useEffect(() => {
    if (artist.length >= 2 || title.length >= 2) {
      const results = window.findSongs({ artist, title });
      setMatched(results[0] || null);
      setConfirmed(false);
    } else {
      setMatched(null);
      setConfirmed(false);
    }
  }, [artist, title]);

  async function submit() {
    const nextErrors = validateSubmission({
      artist,
      title,
      matched,
      confirmed,
      scene,
      contactType,
      contact,
      privacyAgreed,
    });

    setErrors(nextErrors);
    if (Object.keys(nextErrors).length > 0) return;

    const submission = {
      ...(matched || { artist: clean(artist), title: clean(title), cover: '🎵', coverColor: T2.lavender }),
      scene: clean(scene),
      lyric: clean(lyric) || null,
      recommender: (clean(name) || clean(age) || clean(city))
        ? { name: clean(name), age: clean(age), city: clean(city) }
        : null,
      contact: { type: contactType, value: clean(contact) },
      privacyAgreed,
    };

    if (!backendConfigured()) {
      navigate('banner', submission);
      return;
    }

    setSubmitting(true);
    try {
      const result = await callYourMusicFunction('submit-song', {
        artist: submission.artist,
        title: submission.title,
        cover: submission.cover,
        coverImage: submission.coverImage,
        coverColor: submission.coverColor,
        scene: submission.scene,
        lyric: submission.lyric,
        spotifyTrackId: submission.spotifyTrackId || '',
        recommender: submission.recommender,
        contact: submission.contact,
        privacyAgreed,
      });
      navigate('banner', result.song || submission);
    } catch (error) {
      setErrors({
        submit: '제출 저장에 실패했습니다. 잠시 후 다시 시도해주세요.',
      });
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="screen">
      <Bg>
        <SBar />
        <TNav title="RECOMMEND" subtitle="노래 추천 카드 작성" onBack={() => navigate('home')} />

        <div style={{ padding: '0 14px 16px', display: 'flex', flexDirection: 'column', gap: 12 }}>

          {/* 추첨 안내 */}
          <Dialog color={T2.yellow} blinkArrow>
            <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.ink, marginBottom: 6, letterSpacing: '0.05em' }}>
              ★ GIFT ★
            </div>
            추첨을 통해 선물을 드립니다 🎁
          </Dialog>

          {/* 가수 / 제목 */}
          <Dialog color={T2.cream}>
            <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.magenta, marginBottom: 10, letterSpacing: '0.05em' }}>
              ♪ SONG INFO
            </div>
            <div style={{ marginBottom: 6, fontSize: 11, color: T2.inkSoft }}>가수</div>
            <Input
              value={artist}
              onChange={e => { setArtist(e.target.value); clearErrors('song', 'confirmed'); }}
              placeholder="예: Mariya Takeuchi"
            />
            <div style={{ marginTop: 10, marginBottom: 6, fontSize: 11, color: T2.inkSoft }}>노래 제목</div>
            <Input
              value={title}
              onChange={e => { setTitle(e.target.value); clearErrors('song', 'confirmed'); }}
              placeholder="예: Plastic Love"
            />
            <ErrorText>{errors.song}</ErrorText>
          </Dialog>

          {/* 미리보기 + 확인 */}
          {matched && (
            <Dialog color={T2.paper}>
              <div style={{ fontFamily: T2.fontEn, fontSize: 9, color: T2.cyan, marginBottom: 10, letterSpacing: '0.05em' }}>
                IS THIS RIGHT?
              </div>
              <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 12 }}>
                <Plate song={matched} size={64} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: T2.fontEn, fontSize: 11, color: T2.ink, marginBottom: 4, lineHeight: 1.3 }}>
                    {matched.title}
                  </div>
                  <div style={{ fontSize: 11, color: T2.inkSoft }}>{matched.artist}</div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <Btn
                  color={confirmed ? T2.cyan : T2.paper}
                  textColor={confirmed ? '#fff' : T2.ink}
                  size="sm"
                  onClick={() => { setConfirmed(true); clearErrors('confirmed'); }}
                  style={{ flex: 1 }}
                >YES ♥</Btn>
                <Btn
                  color={T2.paper}
                  textColor={T2.ink}
                  size="sm"
                  onClick={() => { setMatched(null); setConfirmed(false); clearErrors('confirmed'); }}
                  style={{ flex: 1 }}
                >NO</Btn>
              </div>
              <ErrorText>{errors.confirmed}</ErrorText>
            </Dialog>
          )}

          {/* 경험담 */}
          <Dialog color={T2.paper}>
            <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.lavender, marginBottom: 10, letterSpacing: '0.05em' }}>
              YOUR SCENE
            </div>
            <div style={{ marginBottom: 8, fontSize: 11.5 }}>
              이 노래를 들었을때 떠오르는<br/>장면 또는 개인적인 경험담
            </div>
            <TArea
              value={scene}
              onChange={e => { setScene(e.target.value); clearErrors('scene'); }}
              placeholder="예: 한밤중 시부야 횡단보도에서..."
              rows={4}
            />
            <ErrorText>{errors.scene}</ErrorText>
          </Dialog>

          {/* 가사 (옵션) */}
          <Dialog color={T2.paper}>
            <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.peach, marginBottom: 10, letterSpacing: '0.05em' }}>
              LYRIC (OPTIONAL)
            </div>
            <div style={{ marginBottom: 8, fontSize: 11.5 }}>마음에 드는 가사 한줄</div>
            <Input
              value={lyric}
              onChange={e => setLyric(e.target.value)}
              placeholder="(선택)"
            />
          </Dialog>

          {/* 추천자 정보 (옵션) */}
          <Dialog color={T2.paper}>
            <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.skyblue, marginBottom: 6, letterSpacing: '0.05em' }}>
              ABOUT YOU
            </div>
            <div style={{ marginBottom: 10, fontSize: 10.5, color: T2.inkSoft, lineHeight: 1.5 }}>
              선택사항, 원치않으면 기입X
            </div>
            <div style={{ marginBottom: 6, fontSize: 11, color: T2.inkSoft }}>이름</div>
            <Input value={name} onChange={e => setName(e.target.value)} placeholder="(선택)" />
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ marginBottom: 6, fontSize: 11, color: T2.inkSoft }}>나이</div>
                <Input value={age} onChange={e => setAge(e.target.value)} type="number" placeholder="(선택)" />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ marginBottom: 6, fontSize: 11, color: T2.inkSoft }}>사는곳</div>
                <Input value={city} onChange={e => setCity(e.target.value)} placeholder="(선택)" />
              </div>
            </div>
          </Dialog>

          {/* 연락처 */}
          <Dialog color={T2.paper}>
            <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.magenta, marginBottom: 10, letterSpacing: '0.05em' }}>
              CONTACT (FOR GIFT)
            </div>
            <div style={{ marginBottom: 8, fontSize: 11.5 }}>
              경품 당첨시 연락할 곳 <span style={{ color: T2.inkSoft }}>(선택사항)</span>
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
              {[
                { k: 'email', l: 'EMAIL' },
                { k: 'instagram', l: 'INSTA' },
                { k: 'kakao', l: 'KAKAO' },
                { k: 'phone', l: 'PHONE' },
              ].map(o => (
                <button
                  key={o.k}
                  onClick={() => { setContactType(o.k); clearErrors('contact'); }}
                  style={{
                    padding: '6px 10px',
                    background: contactType === o.k ? T2.ink : T2.paper,
                    color: contactType === o.k ? '#fff' : T2.ink,
                    border: `2px solid ${T2.ink}`,
                    fontFamily: T2.fontEn, fontSize: 9, cursor: 'pointer',
                    letterSpacing: '0.05em',
                  }}
                >{o.l}</button>
              ))}
            </div>
            <Input
              value={contact}
              onChange={e => { setContact(e.target.value); clearErrors('contact'); }}
              placeholder={
                contactType === 'email' ? 'you@email.com' :
                contactType === 'instagram' ? '@instagram_id' :
                contactType === 'kakao' ? 'kakaotalk_id' :
                '010-0000-0000'
              }
            />
            <ErrorText>{errors.contact}</ErrorText>
            <label style={{
              display: 'flex', gap: 8, alignItems: 'flex-start',
              marginTop: 12, fontSize: 10.5, lineHeight: 1.5,
              color: T2.inkSoft, cursor: 'pointer',
            }}>
              <input
                type="checkbox"
                checked={privacyAgreed}
                onChange={e => { setPrivacyAgreed(e.target.checked); clearErrors('privacy'); }}
                style={{ marginTop: 2, width: 14, height: 14, accentColor: T2.magenta }}
              />
              <span>연락처를 입력한 경우, 경품 당첨 연락을 위해 해당 연락처를 수집하는 데 동의합니다.</span>
            </label>
            <ErrorText>{errors.privacy}</ErrorText>
          </Dialog>

          {/* 제출 */}
          <div style={{ marginTop: 4 }}>
            <Btn
              color={T2.cyan}
              size="lg"
              onClick={submit}
              style={{ width: '100%' }}
            >
              {submitting ? '제출 중...' : '제출하기'}
            </Btn>
            <ErrorText>{errors.submit}</ErrorText>
          </div>

          <div style={{ height: 16 }} />
        </div>
      </Bg>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// 화면 4: 음악 소개 배너
// ══════════════════════════════════════════════════════════════
function BannerScreen({ song: bannerData, navigate, heartCounts }) {
  const song = bannerData && bannerData.song ? bannerData.song : bannerData;
  const returnBeltData = bannerData && bannerData.returnTo === 'belt' ? bannerData.beltData : null;
  if (!song) return null;
  const r = song.recommender;
  const heartCount = Number(heartCounts?.[song.id] ?? song.heartCount ?? 0);
  const backToBelt = () => navigate('belt', returnBeltData || { songs: window.SUSHI_PLATES });

  return (
    <div className="screen">
      <Bg>
        <SBar />
        <TNav title="THIS SONG" subtitle="이 노래는…" onBack={backToBelt} />

        <div style={{ padding: '6px 14px 16px' }}>

          {/* 큰 앨범커버 + 제목 */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 16 }}>
            <div style={{
              width: 160, height: 160,
              background: song.coverColor,
              border: `4px solid ${T2.ink}`,
              boxShadow: `5px 5px 0 ${T2.ink}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              overflow: 'hidden',
              fontSize: 80,
              marginBottom: 16,
            }}>
              {song.coverImage ? (
                <img
                  src={song.coverImage}
                  alt={`${song.artist} - ${song.title}`}
                  style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                />
              ) : (
                song.cover
              )}
            </div>
            <div style={{
              fontFamily: T2.fontKr, fontSize: 15, fontWeight: 900, color: '#fff',
              textShadow: `2px 2px 0 ${T2.ink}`,
              textAlign: 'center', lineHeight: 1.3,
              marginBottom: 6,
            }}>
              {song.title}
            </div>
            <div style={{
              fontFamily: T2.fontKr, fontSize: 15, fontWeight: 900, color: '#fff',
              textShadow: `1px 1px 0 ${T2.ink}`,
              lineHeight: 1.3,
              textAlign: 'center',
            }}>
              ♪ {song.artist} ♪
            </div>
            <div
              aria-label={`하트 ${heartCount}개`}
              style={{
                marginTop: 10,
                minWidth: 82,
                height: 34,
                padding: '4px 9px',
                background: T2.cream,
                border: `3px solid ${T2.ink}`,
                boxShadow: `2px 2px 0 ${T2.ink}`,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: 7,
                pointerEvents: 'none',
              }}
            >
              <PixelHeartIcon size={3} />
              <span style={{
                fontFamily: T2.fontEn,
                fontSize: 15,
                lineHeight: 1,
                color: T2.magenta,
                textShadow: `1px 1px 0 ${T2.ink}`,
              }}>
                {heartCount}
              </span>
            </div>
          </div>

          {/* 경험담 (대화창) */}
          <div style={{ marginBottom: 12 }}>
            <Dialog color={T2.cream}>
              <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.magenta, marginBottom: 8, letterSpacing: '0.05em' }}>
                ♥ THE SCENE
              </div>
              "{song.scene}"
              <SpotifyMiniEmbed song={song} />
              <FullSongLinks song={song} />
            </Dialog>
          </div>

          {/* 가사 (있을 때만) */}
          {song.lyric && song.lyric !== '(instrumental)' && (
            <div style={{ marginBottom: 12 }}>
              <Dialog color={T2.paper}>
                <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.lavender, marginBottom: 8, letterSpacing: '0.05em' }}>
                  ♪ LYRIC
                </div>
                <div style={{ fontStyle: 'italic', textAlign: 'center', fontSize: 13, lineHeight: 1.6 }}>
                  ❝ {song.lyric} ❞
                </div>
              </Dialog>
            </div>
          )}

          {/* 추천자 */}
          {r && (r.name || r.age || r.city) && (
            <div style={{ marginBottom: 16 }}>
              <Dialog color={T2.paper}>
                <div style={{ fontFamily: T2.fontEn, fontSize: 10, color: T2.cyan, marginBottom: 8, letterSpacing: '0.05em' }}>
                  RECOMMENDED BY
                </div>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', fontSize: 12 }}>
                  {r.name && <span style={{ fontWeight: 'bold' }}>{r.name}</span>}
                  {r.age && <span style={{ color: T2.inkSoft }}>{r.age}세</span>}
                  {r.city && <span style={{ color: T2.inkSoft }}>· {r.city}</span>}
                </div>
              </Dialog>
            </div>
          )}

          {/* 노래 고르기로 돌아가기 */}
          <Btn
            color={T2.magenta}
            size="lg"
            onClick={backToBelt}
            style={{ width: '100%', fontFamily: T2.fontKr, fontSize: 14 }}
          >
            ◀ 되돌아가기
          </Btn>

          <div style={{ height: 16 }} />
        </div>
      </Bg>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// App: 화면 라우팅
// ══════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState('home');
  const [data, setData] = useState(null);
  const [heartCounts, setHeartCounts] = useState({});
  const [heartClicked, setHeartClicked] = useState(false);

  function resetHeartSession() {
    setHeartCounts({});
    setHeartClicked(false);
  }

  function navigate(to, payload) {
    setScreen(to);
    if (payload !== undefined) setData(payload);
    // 화면 전환 시 스크롤 최상단
    setTimeout(() => {
      const sa = document.querySelector('.scroll-area');
      if (sa) sa.scrollTop = 0;
    }, 0);
  }

  const screens = {
    home:   <HomeScreen navigate={navigate} resetHeartSession={resetHeartSession} />,
    belt:   <BeltScreen
      navigate={navigate}
      initialData={data}
      heartCounts={heartCounts}
      setHeartCounts={setHeartCounts}
      heartClicked={heartClicked}
      setHeartClicked={setHeartClicked}
    />,
    form:   <FormScreen navigate={navigate} initialData={data} />,
    banner: <BannerScreen navigate={navigate} song={data} heartCounts={heartCounts} />,
  };

  return <div className="phone">{screens[screen] || screens.home}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
